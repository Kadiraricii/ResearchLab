[package]
name = "tauri-app"
version = "0.1.0"
description = "Vercel Security Analyzer"
authors = ["Kadir Arici"]
license = "MIT"
edition = "2021"

[lib]
name = "vercel_hack_analysis"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener  = "2"
tauri-plugin-updater = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client — reqwest 0.13 already in Cargo.lock (pulled by Tauri)
reqwest = { version = "0.13", features = ["json"] }

# Async runtime — tokio 1.x already in Cargo.lock
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1"

# Concurrency — parallel cache and analysis
dashmap = "6"
rayon = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Time — timestamp handling
chrono = { version = "0.4", features = ["serde"] }

# Environment variables (dotenvy is the maintained fork of dotenv)
dotenvy = "0.15"

# Local database — rusqlite with bundled SQLite (no system lib required)
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"
tempfile = "3"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
insta = "1"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
fake = { version = "2", features = ["derive"] }
test-log = "0.2"

[[bench]]
name = "analyzer_bench"
harness = false
path = "../benches/analyzer_bench.rs"

[[bench]]
name = "db_bench"
harness = false
path = "../benches/db_bench.rs"
