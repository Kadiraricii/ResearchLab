# ─── cargo-nextest configuration (Phase 10.2) ─────────────────────────────────

# ─── Default profile: local development ───────────────────────────────────────
[profile.default]
# Saturate all CPU cores; each test is short so we can afford it
test-threads = "num-cpus"
# No retries locally — flaky tests should be fixed, not hidden
retries = 0
# Don't stop on first failure so we see the full picture
fail-fast = false
# Slow-test warning threshold (not a hard limit)
slow-timeout = { period = "10s" }

# ─── CI profile: strict, reproducible, with XML output ────────────────────────
[profile.ci]
test-threads = "num-cpus"
# Retry flaky tests twice before failing the job
retries = 2
fail-fast = false
# JUnit XML → picked up by GitHub Actions test-summary action
junit = { path = "junit.xml" }
slow-timeout = { period = "30s", terminate-after = 3 }

# ─── E2E profile: serial, generous timeouts ───────────────────────────────────
[profile.e2e]
# E2E tests must be serial — they share UI state
test-threads = 1
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = true

# ─── Test group caps ──────────────────────────────────────────────────────────
# Groups let us throttle tests that compete for shared resources
# (e.g., tests that bind to a fixed port or write to the same temp dir).
[test-groups]
# Unit tests: full parallelism — they are hermetic
unit        = { max-threads = "num-cpus" }
# Integration tests: limited because they may spin up mock servers
integration = { max-threads = 4 }
# E2E tests: always serial
e2e         = { max-threads = 1 }

# ─── Profile overrides ────────────────────────────────────────────────────────
[[profile.default.overrides]]
# Route any test whose name contains "e2e" to the e2e group automatically
filter = "test(e2e)"
test-group = "e2e"

[[profile.default.overrides]]
# Tests tagged #[ignore] are large integration suites — mark them as slow
filter = "test(integration)"
test-group = "integration"
